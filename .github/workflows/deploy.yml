name: Deploy AWS Cloud Resume

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::600442391764:role/github-actions-role
          aws-region: us-east-1


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3



      - name: Terraform Format Check
        working-directory: infra/environments/prod
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: infra/environments/prod
        run: terraform init


      - name: Terraform Validate
        working-directory: infra/environments/prod
        run: terraform validate



      - name: Terraform Apply
        working-directory: infra/environments/prod
        run: terraform apply -auto-approve -var="budget_email=${{ secrets.BUDGET_EMAIL }}"


      - name: Deploy frontend to S3
        run: |
          aws s3 sync site/src/ s3://garmar-aws-cloud-resume-site


      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1VQ7BI879M6HP \
            --paths "/*"