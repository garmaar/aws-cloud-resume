<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 700" width="1360" height="700" role="img" aria-labelledby="t d" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Cloud resume architecture</title>
  <desc id="d">The browser requests static files from CloudFront, which reads a private S3 origin through OAC, and calls GET /visits on API Gateway, which invokes a Python Lambda that updates a DynamoDB counter. GitHub Actions syncs the site to S3, invalidates the CloudFront cache and runs Terraform, which provisions the AWS resources.</desc>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#b8c4d0" stroke-width="1.5"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7fd1c1" stroke-width="1.5"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#9fb0c3" stroke-width="1.5"/></marker>
  </defs>

  <rect width="1360" height="700" fill="#0d1626"/>

  <!-- AWS runtime group -->
  <rect x="30" y="185" width="1300" height="150" fill="none" stroke="#4a5a6c" stroke-width="1.2" stroke-dasharray="3 5" rx="3"/>
  <text x="50" y="208" font-size="14" fill="#9fb0c3">AWS runtime resources</text>

  <!-- Browser -->
  <rect x="417" y="20" width="200" height="62" fill="#16202e" stroke="#5b6b7c" rx="3"/>
  <text x="517" y="48" font-size="17" font-weight="700" fill="#e8e4d8" text-anchor="middle">Browser</text>
  <text x="517" y="68" font-size="13" fill="#9fb0c3" text-anchor="middle">HTML / JavaScript</text>

  <!-- Request lines -->
  <path d="M457 82 V130 H350 V228" fill="none" stroke="#b8c4d0" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M577 82 V130 H685 V228" fill="none" stroke="#b8c4d0" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="338" y="124" font-size="14" fill="#b8c4d0" text-anchor="end">HTML / CSS / JS</text>
  <text x="697" y="124" font-size="14" fill="#b8c4d0">GET /visits</text>

  <!-- Row: S3, CloudFront, API Gateway, Lambda, DynamoDB -->
  <g fill="#16202e" stroke="#5b6b7c">
    <rect x="60" y="230" width="140" height="70" rx="3"/>
    <rect x="260" y="230" width="180" height="70" rx="3"/>
    <rect x="590" y="230" width="190" height="70" rx="3"/>
    <rect x="860" y="230" width="140" height="70" rx="3"/>
    <rect x="1120" y="230" width="180" height="70" rx="3"/>
  </g>
  <g text-anchor="middle">
    <text x="130" y="262" font-size="17" font-weight="700" fill="#e8e4d8">S3</text>
    <text x="130" y="284" font-size="13" fill="#9fb0c3">private origin</text>
    <text x="350" y="262" font-size="17" font-weight="700" fill="#e8e4d8">CloudFront</text>
    <text x="350" y="284" font-size="13" fill="#9fb0c3">edge cache</text>
    <text x="685" y="262" font-size="17" font-weight="700" fill="#e8e4d8">API Gateway</text>
    <text x="685" y="284" font-size="13" fill="#9fb0c3">GET /visits</text>
    <text x="930" y="262" font-size="17" font-weight="700" fill="#e8e4d8">Lambda</text>
    <text x="930" y="284" font-size="13" fill="#9fb0c3">Python</text>
    <text x="1210" y="262" font-size="17" font-weight="700" fill="#e8e4d8">DynamoDB</text>
    <text x="1210" y="284" font-size="13" fill="#9fb0c3">visitor counter</text>
  </g>

  <!-- Row arrows -->
  <path d="M260 268 H202" fill="none" stroke="#b8c4d0" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="231" y="254" font-size="14" fill="#b8c4d0" text-anchor="middle">OAC</text>
  <path d="M780 268 H858" fill="none" stroke="#b8c4d0" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="819" y="254" font-size="14" fill="#b8c4d0" text-anchor="middle">invoke</text>
  <path d="M1000 268 H1118" fill="none" stroke="#b8c4d0" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="1059" y="254" font-size="14" fill="#b8c4d0" text-anchor="middle">UpdateItem</text>

  <!-- GitHub Actions -->
  <rect x="380" y="470" width="330" height="100" fill="#16202e" stroke="#5b6b7c" rx="3"/>
  <g text-anchor="middle">
    <text x="545" y="506" font-size="17" font-weight="700" fill="#e8e4d8">GitHub Actions</text>
    <text x="545" y="530" font-size="13" fill="#9fb0c3">CI / CD</text>
    <text x="545" y="550" font-size="13" fill="#9fb0c3">OIDC · IAM role · STS</text>
  </g>

  <!-- Terraform -->
  <rect x="860" y="470" width="300" height="100" fill="#16202e" stroke="#5b6b7c" rx="3"/>
  <g text-anchor="middle">
    <text x="1010" y="514" font-size="17" font-weight="700" fill="#e8e4d8">Terraform</text>
    <text x="1010" y="540" font-size="13" fill="#9fb0c3">infrastructure as code</text>
  </g>

  <!-- Deployment (teal dashed) -->
  <path d="M440 470 V410 H130 V303" fill="none" stroke="#7fd1c1" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#at)"/>
  <text x="170" y="400" font-size="14" fill="#7fd1c1">aws s3 sync</text>
  <path d="M620 470 V380 H350 V303" fill="none" stroke="#7fd1c1" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#at)"/>
  <text x="400" y="370" font-size="14" fill="#7fd1c1">invalidate cache</text>

  <!-- Provisioning (dotted) -->
  <path d="M710 520 H858" fill="none" stroke="#9fb0c3" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#ap)"/>
  <text x="784" y="508" font-size="14" fill="#b8c4d0" text-anchor="middle">terraform apply</text>
  <path d="M1010 470 V338" fill="none" stroke="#9fb0c3" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#ap)"/>
  <text x="1030" y="410" font-size="14" fill="#b8c4d0">provision resources</text>

  <!-- Legend -->
  <g font-size="14" fill="#b8c4d0">
    <line x1="60" y1="625" x2="115" y2="625" stroke="#b8c4d0" stroke-width="1.5"/>
    <text x="130" y="630">Requests</text>
    <line x1="280" y1="625" x2="335" y2="625" stroke="#7fd1c1" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="350" y="630">Deployment</text>
    <line x1="520" y1="625" x2="575" y2="625" stroke="#9fb0c3" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/>
    <text x="590" y="630">Provisioning</text>
  </g>

  <text x="30" y="678" font-size="12" fill="#9fb0c3">Arrows show requests and deployment actions. Responses are omitted for clarity. OAC = Origin Access Control; OIDC = OpenID Connect; STS = AWS Security Token Service.</text>
</svg>
